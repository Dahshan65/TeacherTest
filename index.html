<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار كفاءة المعلمين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Amiri','Traditional Arabic','Simplified Arabic',serif}
body{background:#eef2f7;color:#1c2b3a;min-height:100vh;display:flex;flex-direction:column}
header{background:#0b2e59;color:#fff;text-align:center;padding:22px 16px}
header h1{font-size:22px}
header p{font-size:14px;opacity:.85;margin-top:6px}
main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:18px 16px}
.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.card h2{color:#0b2e59;font-size:18px;margin-bottom:14px}
label{display:block;font-size:14px;margin:12px 0 6px;font-weight:bold}
input,select{width:100%;padding:12px;border:1px solid #c8d2df;border-radius:10px;font-size:17px;font-family:inherit;background:#fff}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;font-size:18px;font-family:inherit;font-weight:bold;cursor:pointer;margin-top:16px}
.primary{background:#0b2e59;color:#fff}
.light{background:#fff;color:#0b2e59;border:2px solid #0b2e59}
.small-link{background:none;border:none;color:#0b2e59;text-decoration:underline;font-size:16px;font-family:inherit;margin:14px auto 0;cursor:pointer;display:block}
.hidden{display:none}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px;font-weight:bold;color:#0b2e59}
.timer{background:#0b2e59;color:#fff;padding:6px 12px;border-radius:20px;direction:ltr}
.timer.warn{background:#c0392b}
.progress{height:8px;background:#dde4ee;border-radius:8px;overflow:hidden;margin-bottom:14px}
.progress div{height:100%;background:#2f80ed;width:0;transition:width .3s}
.section-name{font-size:13px;color:#5a6b7d;margin-bottom:8px}
.question{font-size:22px;line-height:2;margin-bottom:16px}
.option{display:block;width:100%;text-align:right;padding:14px;margin-bottom:10px;border:2px solid #c8d2df;border-radius:10px;background:#fff;font-size:19px;cursor:pointer;color:#1c2b3a;font-family:inherit}
.option.selected{border-color:#0b2e59;background:#e3ecf8;font-weight:bold}
.nav{display:flex;gap:10px}
.nav .btn{margin-top:6px}
.msg{text-align:center;line-height:2;font-size:17px}
.err{color:#c0392b;font-size:14px;margin-top:10px;text-align:center;min-height:20px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
th,td{border:1px solid #dde4ee;padding:8px;text-align:center}
th{background:#0b2e59;color:#fff}
footer{text-align:center;padding:16px;font-size:14px;color:#5a6b7d}
footer a{color:#0b2e59;font-weight:bold;text-decoration:none}
footer .wa{display:inline-block;margin-top:8px;background:#25d366;color:#fff;padding:8px 18px;border-radius:20px}
.rec{padding:12px;border-radius:10px;font-weight:bold;text-align:center;margin:12px 0;font-size:20px}
.rec.good{background:#e6f4ea;color:#1e7e34}
.rec.mid{background:#fff4e0;color:#b26a00}
.rec.bad{background:#fdecea;color:#c0392b}
.info p{margin:4px 0;font-size:17px}
.warn-box{background:#fdecea;color:#c0392b;border-radius:10px;padding:10px;margin-top:10px;font-weight:bold}
.apology{background:#f4f6f9;border-radius:10px;padding:12px;line-height:2;margin-top:12px;white-space:pre-line;font-size:17px}
.view-btn{background:#0b2e59;color:#fff;border:none;border-radius:8px;padding:6px 12px;font-family:inherit;font-size:15px;cursor:pointer}
@media print{header,footer,.btn,.small-link{display:none !important}body{background:#fff}.card{box-shadow:none}}
.check{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #c8d2df;border-radius:10px;margin-bottom:8px;font-size:18px;font-weight:normal;cursor:pointer}
.check input{width:22px;height:22px;flex:none;accent-color:#0b2e59}
.check.all{background:#e3ecf8;font-weight:bold}
.summary-box{background:#f4f6f9;border-radius:10px;padding:10px;margin-top:6px;font-size:16px;text-align:center}
.test-info{background:#e3ecf8;border-radius:10px;padding:10px;margin-top:14px;font-size:16px;line-height:1.9;text-align:center;color:#0b2e59}
details{margin-top:14px;border:1px solid #dde4ee;border-radius:10px;padding:10px}
summary{font-weight:bold;cursor:pointer;color:#0b2e59;font-size:17px}
.wsec{margin-top:12px;font-weight:bold;color:#0b2e59;border-bottom:1px solid #dde4ee;padding-bottom:4px}
.wq{padding:8px 0;border-bottom:1px dashed #dde4ee;font-size:16px;line-height:1.9}
.wq .yours{color:#c0392b}
.wq .right{color:#1e7e34}
</style>
</head>
<body>

<header>
  <h1>اختبار كفاءة المعلمين</h1>
  <p>وفق المنهاج الأردني</p>
</header>

<main>

  <!-- الشاشة الرئيسية -->
  <div id="homeScreen" class="card">
    <h2>بيانات المتقدم</h2>
    <label>الاسم الرباعي</label>
    <input id="name" type="text" placeholder="اكتب اسمك الرباعي">
    <label>رقم الهاتف</label>
    <input id="phone" type="tel" placeholder="07XXXXXXXX">
    <label>المادة</label>
    <select id="subject"><option>اللغة العربية</option></select>
    <label>المؤهل العلمي</label>
    <select id="degree">
      <option value="">اختر المؤهل</option>
      <option>دبلوم</option>
      <option>بكالوريوس</option>
      <option>دبلوم عالٍ</option>
      <option>ماجستير</option>
      <option>دكتوراه</option>
    </select>
    <label>سنوات الخبرة</label>
    <select id="experience">
      <option value="">اختر سنوات الخبرة</option>
      <option>بدون خبرة</option>
      <option>أقل من سنتين</option>
      <option>من 2 إلى 5 سنوات</option>
      <option>من 6 إلى 10 سنوات</option>
      <option>أكثر من 10 سنوات</option>
    </select>
    <div class="test-info" id="testInfo"></div>
    <div class="err" id="homeErr"></div>
    <button class="btn primary" onclick="startTest()">ابدأ الاختبار</button>
    <button class="small-link" onclick="show('loginScreen')">دخول الإدارة</button>
  </div>

  <!-- شاشة الاختبار -->
  <div id="testScreen" class="card hidden">
    <div class="topbar">
      <span id="counter"></span>
      <span class="timer" id="timer">60:00</span>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <div class="section-name" id="sectionName"></div>
    <div class="question" id="qText"></div>
    <div id="options"></div>
    <div class="err" id="testErr"></div>
    <div class="nav">
      <button class="btn light" id="prevBtn" onclick="prevQ()">السابق</button>
      <button class="btn primary" id="nextBtn" onclick="nextQ()">التالي</button>
    </div>
  </div>

  <!-- شاشة الانتهاء -->
  <div id="endScreen" class="card hidden">
    <p class="msg">شكرًا لك على تقدّمك.<br>تم استلام إجاباتك، وسيتم التواصل معك قريبًا.</p>
    <button class="btn primary" onclick="location.reload()">العودة للرئيسية</button>
  </div>

  <!-- دخول الإدارة -->
  <div id="loginScreen" class="card hidden">
    <h2>دخول الإدارة</h2>
    <label>كلمة السر</label>
    <input id="pass" type="password">
    <div class="err" id="loginErr"></div>
    <button class="btn primary" onclick="login()">دخول</button>
    <button class="small-link" onclick="show('homeScreen')">رجوع</button>
  </div>

  <!-- لوحة الإدارة -->
  <div id="adminScreen" class="card hidden">
    <h2>إعدادات الاختبار</h2>
    <p style="margin-bottom:10px">ضع إشارة على الأقسام التي تريد فحص المتقدم فيها:</p>
    <div id="sectionChecks"></div>
    <div class="summary-box" id="settingsSummary"></div>
    <div class="err" id="settingsMsg"></div>
    <h2 style="margin-top:22px">المتقدمون</h2>
    <div id="adminList"></div>
    <button class="small-link" onclick="show('homeScreen')">خروج</button>
  </div>

  <!-- تقرير المتقدم -->
  <div id="reportScreen" class="card hidden">
    <h2>تقرير المتقدم</h2>
    <div id="reportBody"></div>
    <button class="btn primary" onclick="shareReport()">مشاركة التقرير عبر واتساب</button>
    <button class="btn light" id="apologyBtn" onclick="sendApology()">إرسال رسالة الاعتذار للمتقدم</button>
    <button class="btn light" onclick="printReport()">طباعة التقرير</button>
    <button class="small-link" onclick="renderAdmin();show('adminScreen')">قائمة المتقدمين وإعدادات الاختبار</button>
  </div>

</main>

<footer>
  <a href="https://dahshansoft.com" target="_blank">dahshansoft.com</a><br>
  <a class="wa" href="https://wa.me/962779221235" target="_blank">تواصل عبر واتساب</a>
</footer>

<script>
const ADMIN_PASS = "1234";
const TEST_MINUTES = 60;

const sections = { nahw: "النحو والصرف", imla: "الإملاء", balagha: "البلاغة", adab: "الأدب والنصوص", skills: "المهارات التدريسية" };

// عدد الأسئلة التي تظهر للمتقدم من كل قسم (تُختار عشوائيًا من بنك القسم)
const PER_SECTION = { nahw: 40, imla: 40, balagha: 40, adab: 40, skills: 10 };

// خمسة نماذج ثابتة مختلفة جزئيًا — كل نموذج يأخذ 40 سؤالًا من بنك كل قسم بإزاحة مختلفة
const FORMS = ["أ","ب","ج","د","هـ"];

// a = رقم الإجابة الصحيحة (0 أو 1 أو 2) — الخيارات تُخلط تلقائيًا عند العرض
const questions = [
  {s:"nahw", q:"ما إعراب «السماءَ» في: «ما أحسنَ السماءَ!»؟", o:["مفعول به منصوب بالفتحة","تمييز منصوب بالفتحة","خبر «ما» منصوب بالفتحة"], a:0},
  {s:"nahw", q:"ما إعراب «رجلَ» في: «لا رجلَ في الدار»؟", o:["اسم «لا» منصوب بالفتحة الظاهرة","اسم «لا» النافية للجنس مبني على الفتح في محل نصب","مبتدأ مرفوع بالضمة المقدّرة"], a:1},
  {s:"nahw", q:"ما إعراب «عبدَ» في: «يا عبدَ اللهِ»؟", o:["منادى مبني على الضم في محل نصب","بدل منصوب بالفتحة","منادى منصوب بالفتحة لأنه مضاف"], a:2},
  {s:"nahw", q:"ما محل جملة «يكتبُ درسَه» في: «الطالبُ يكتبُ درسَه»؟", o:["في محل رفع خبر","في محل نصب حال","لا محل لها من الإعراب"], a:0},
  {s:"nahw", q:"ما محل جملة «نجحَ» في: «جاءَ الذي نجحَ»؟", o:["في محل رفع صفة","لا محل لها لأنها صلة الموصول","في محل نصب حال"], a:1},
  {s:"nahw", q:"ما إعراب «نفسَه» في: «أكرمتُ المعلمَ نفسَه»؟", o:["بدل منصوب","مفعول به ثانٍ منصوب","توكيد معنوي منصوب"], a:2},
  {s:"nahw", q:"ما إعراب «قاضٍ» في: «حكمَ قاضٍ عادلٌ»؟", o:["فاعل مرفوع بالضمة المقدّرة على الياء المحذوفة","فاعل مرفوع بالضمة الظاهرة","فاعل مرفوع بالضمة المقدّرة على الألف"], a:0},
  {s:"nahw", q:"لماذا قُدّرت الضمة على «الفتى» في: «جاء الفتى»؟", o:["للثقل","للتعذّر","لاشتغال المحل بحركة المناسبة"], a:1},
  {s:"nahw", q:"لماذا قُدّرت الضمة على «يرمي» في: «الصيادُ يرمي»؟", o:["للتعذّر","لأنه مبني","للثقل"], a:2},
  {s:"nahw", q:"ما علامة جزم «يسعَ» في: «لم يسعَ الكسولُ إلى المجد»؟", o:["حذف حرف العلة","السكون الظاهر","السكون المقدّر على الألف"], a:0},
  {s:"nahw", q:"ما علامة جزم الفعل في: «الطلابُ لم يكتبوا الواجب»؟", o:["السكون","حذف النون لأنه من الأفعال الخمسة","حذف حرف العلة"], a:1},
  {s:"nahw", q:"ما حكم الفعل «يدرّسْنَ» في: «المعلماتُ يدرّسْنَ بإخلاص»؟", o:["مرفوع بثبوت النون","مرفوع بالضمة المقدّرة","مبني على السكون لاتصاله بنون النسوة"], a:2},
  {s:"nahw", q:"ما حكم الفعل «تنجحَنَّ» في: «واللهِ لتنجحَنَّ»؟", o:["مبني على الفتح لاتصاله بنون التوكيد المباشرة","مرفوع بالضمة المقدّرة","منصوب بالفتحة"], a:0},
  {s:"nahw", q:"لماذا مُنعت كلمة «صحراء» من الصرف؟", o:["لأنها على صيغة منتهى الجموع","لأنها مختومة بألف التأنيث الممدودة","لأنها علم أعجمي"], a:1},
  {s:"nahw", q:"ما وزن كلمة «مصابيح»؟", o:["مفاعل","فعاليل","مفاعيل"], a:2},
  {s:"nahw", q:"ما أصل الفعل «اصطبرَ»؟", o:["اصتبرَ، أُبدلت التاء طاءً","اصطبرَ بلا إبدال","اطصبرَ، قُدّمت الطاء"], a:0},
  {s:"nahw", q:"ما أصل الألف في الفعل «قالَ»؟", o:["ياء","واو","ألف أصلية"], a:1},
  {s:"nahw", q:"كلمة «مُختار» تصلح أن تكون:", o:["اسم فاعل فقط","اسم مفعول فقط","اسم فاعل واسم مفعول معًا"], a:2},
  {s:"nahw", q:"ما الصواب في النسبة إلى «سَنَة»؟", o:["سَنَوِيّ","سَنَتِيّ","سِنِّيّ"], a:0},
  {s:"nahw", q:"أيّ الجمل الآتية صحيحة في استعمال العدد؟", o:["قرأتُ ثلاثةَ قصصٍ","قرأتُ ثلاثَ قصصٍ","حضرَ خمسُ طلابٍ"], a:1},
  {s:"nahw", q:"ما إعراب «أحدَ عشرَ» في: «حضرَ أحدَ عشرَ طالبًا»؟", o:["فاعل مرفوع بالضمة","مفعول به منصوب","مبني على فتح الجزأين في محل رفع فاعل"], a:2},
  {s:"nahw", q:"ما إعراب «زيدٌ» في: «ما جاءَ إلا زيدٌ»؟", o:["فاعل مرفوع","مستثنى مرفوع","بدل مرفوع"], a:0},
  {s:"nahw", q:"ما إعراب «زيدًا» في: «جاءَ الطلابُ إلا زيدًا»؟", o:["مفعول به منصوب","مستثنى بـ«إلا» منصوب","بدل منصوب"], a:1},
  {s:"nahw", q:"ما إعراب «زيدٌ» في: «ما جاءَ الطلابُ إلا زيدٌ»؟", o:["فاعل مرفوع","خبر مرفوع","بدل من «الطلاب» مرفوع"], a:2},
  {s:"nahw", q:"ما إعراب «نفسًا» في: «طابَ محمدٌ نفسًا»؟", o:["تمييز منصوب","حال منصوبة","مفعول به منصوب"], a:0},
  {s:"nahw", q:"ما إعراب «رغبةً» في: «حضرتُ رغبةً في العلم»؟", o:["مفعول مطلق منصوب","مفعول لأجله منصوب","حال منصوبة"], a:1},
  {s:"nahw", q:"ما إعراب «النيلَ» في: «سرتُ والنيلَ»؟", o:["اسم معطوف منصوب","مفعول به منصوب","مفعول معه منصوب"], a:2},
  {s:"nahw", q:"ما إعراب «ضربتين» في: «ضربتُه ضربتين»؟", o:["مفعول مطلق مبيّن للعدد منصوب بالياء","ظرف زمان منصوب بالياء","تمييز منصوب بالياء"], a:0},
  {s:"nahw", q:"ما إعراب «تنجحْ» في: «إنْ تدرسْ تنجحْ»؟", o:["فعل الشرط مجزوم","جواب الشرط مجزوم","فعل مضارع مرفوع"], a:1},
  {s:"nahw", q:"كتب طالب: «لا تنسى واجبك». أين الخطأ وما صوابه؟", o:["لا يوجد خطأ في الجملة","«واجبك» والصواب «واجبُك»","«تنسى» والصواب «تنسَ» لأنه مجزوم بـ«لا» الناهية"], a:2},
  {s:"nahw", q:"كتب طالب: «رأيتُ المعلمون في الساحة». أين الخطأ وما صوابه؟", o:["«المعلمون» والصواب «المعلمين» لأنه مفعول به","«الساحة» والصواب «الساحةَ»","لا يوجد خطأ في الجملة"], a:0},
  {s:"nahw", q:"كتب طالب: «كان المهندسون حاضرون». أين الخطأ وما صوابه؟", o:["«المهندسون» والصواب «المهندسين»","«حاضرون» والصواب «حاضرين» لأنه خبر كان","لا يوجد خطأ في الجملة"], a:1}
  ,{s:"imla", q:"لماذا كُتبت الهمزة على نبرة في «سُئِلَ»؟", o:["لأن الكسرة أقوى من الضمة","لأن الضمة أقوى من الكسرة","لأنها همزة متطرفة"], a:0},
  {s:"imla", q:"لماذا كُتبت الهمزة على السطر في «مُروءة»؟", o:["لأنها مفتوحة وما قبلها مضموم","لأنها جاءت بعد واو ساكنة","لأنها همزة متطرفة"], a:1},
  {s:"imla", q:"على أيّ أساس تُكتب الهمزة المتطرفة؟", o:["حركتها هي","أقوى الحركتين: حركتها وحركة ما قبلها","حركة الحرف الذي قبلها"], a:2},
  {s:"imla", q:"لماذا كُتبت الهمزة على واو في «تفاؤل»؟", o:["لأنها مضمومة وما قبلها ساكن، والضمة أقوى من السكون","لأن ما قبلها مضموم","لأنها همزة متطرفة"], a:0},
  {s:"imla", q:"لماذا كُتبت الهمزة على السطر في «تساءَلَ»؟", o:["لأنها متطرفة بعد ساكن","لأنها مفتوحة بعد ألف ساكنة","لأنها همزة وصل"], a:1},
  {s:"imla", q:"لماذا كُتبت الهمزة على نبرة في «هيْئة»؟", o:["لأنها مكسورة","لأنها متطرفة","لأنها جاءت بعد ياء ساكنة"], a:2},
  {s:"imla", q:"لماذا كُتبت الهمزة على السطر في «دِفْء»؟", o:["لأنها متطرفة وما قبلها ساكن","لأنها مفتوحة","لأن ما قبلها مكسور"], a:0},
  {s:"imla", q:"لماذا كُتبت الهمزة على ياء في «شاطِئ»؟", o:["لأنها مكسورة","لأنها متطرفة وما قبلها مكسور","لأنها بعد ألف"], a:1},

let current = 0, answers = [], order = [], candidate = {}, timeLeft = 0, timerId = null, finished = false;

// ===== إعدادات الأقسام (يحددها المدير) =====
function loadSettings(){
  try {
    const st = JSON.parse(localStorage.getItem('teacherSettings'));
    if(st && Array.isArray(st.sections)){
      const list = Object.keys(sections).filter(k => st.sections.includes(k));
      if(list.length) return list;
    }
  } catch(e){}
  return Object.keys(sections);
}
function saveSettings(list){
  try { localStorage.setItem('teacherSettings', JSON.stringify({ sections: list })); } catch(e){}
}
function countQuestions(list){ return list.reduce((n, k) => n + PER_SECTION[k], 0); }
function testMinutes(list){
  const all = countQuestions(Object.keys(sections));
  return Math.max(10, Math.round(TEST_MINUTES * countQuestions(list) / all));
}

let selectedSections = null;
function renderSettings(){
  if(!selectedSections) selectedSections = loadSettings();
  const keys = Object.keys(sections);
  const box = document.getElementById('sectionChecks');
  box.innerHTML = "";
  const addCheck = (label, checked, cls, onChange) => {
    const l = document.createElement('label');
    l.className = 'check ' + cls;
    const c = document.createElement('input');
    c.type = 'checkbox'; c.checked = checked;
    c.onchange = () => onChange(c.checked);
    l.appendChild(c);
    l.appendChild(document.createTextNode(label));
    box.appendChild(l);
  };
  addCheck('كل الأقسام', selectedSections.length === keys.length, 'all', ch => {
    selectedSections = ch ? keys.slice() : [];
    applySettings();
  });
  keys.forEach(k => {
    addCheck(`${sections[k]} (${PER_SECTION[k]} سؤالًا)`, selectedSections.includes(k), '', ch => {
      selectedSections = ch ? keys.filter(x => selectedSections.includes(x) || x === k) : selectedSections.filter(x => x !== k);
      applySettings();
    });
  });
  const sum = document.getElementById('settingsSummary');
  const msg = document.getElementById('settingsMsg');
  if(selectedSections.length === 0){
    sum.textContent = "";
    msg.textContent = "اختر قسمًا واحدًا على الأقل";
  } else {
    msg.textContent = "";
    sum.textContent = `الاختبار الحالي: ${countQuestions(selectedSections)} سؤالًا — المدة ${testMinutes(selectedSections)} دقيقة`;
  }
}
function applySettings(){
  if(selectedSections.length) saveSettings(selectedSections);
  renderSettings();
  updateTestInfo();
}
function updateTestInfo(){
  const list = loadSettings();
  const el = document.getElementById('testInfo');
  if(!el) return;
  const names = list.length === Object.keys(sections).length ? "جميع الأقسام" : list.map(k => sections[k]).join('، ');
  el.textContent = `يشمل الاختبار: ${names} — ${countQuestions(list)} سؤالًا خلال ${testMinutes(list)} دقيقة`;
}

function show(id){
  document.querySelectorAll('main > .card').forEach(c => c.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  window.scrollTo(0,0);
}

function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startTest(){
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const degree = document.getElementById('degree').value;
  const experience = document.getElementById('experience').value;
  const err = document.getElementById('homeErr');

  if(!name || !phone || !degree || !experience){ err.textContent = "يرجى تعبئة جميع البيانات"; return; }
  if(!/^07\d{8}$/.test(phone)){ err.textContent = "رقم الهاتف غير صحيح (مثال: 0791234567)"; return; }
  err.textContent = "";

  candidate = {
    name, phone, degree, experience,
    subject: document.getElementById('subject').value,
    date: new Date().toLocaleString('ar-JO')
  };
  const formIndex = Math.floor(Math.random() * FORMS.length);
  candidate.form = FORMS[formIndex];
  const active = loadSettings();
  candidate.sections = active;
  candidate.minutes = testMinutes(active);
  finished = false;
  order = [];
  active.forEach(key => {
    const bank = questions.map((q, i) => i).filter(i => questions[i].s === key);
    const n = PER_SECTION[key];
    let picked;
    if(bank.length <= n){ picked = bank.slice(); }
    else {
      const step = Math.floor(bank.length / FORMS.length);
      picked = [];
      for(let j = 0; j < n; j++) picked.push(bank[(formIndex * step + j) % bank.length]);
    }
    shuffle(picked).forEach(i => order.push({ i, opts: shuffle([0,1,2]) }));
  });
  answers = new Array(order.length).fill(null);
  current = 0;
  timeLeft = candidate.minutes * 60;
  show('testScreen');
  renderQ();
  startTimer();
}

function renderQ(){
  const item = order[current];
  const q = questions[item.i];
  document.getElementById('counter').textContent = `سؤال ${current + 1} من ${order.length}`;
  document.getElementById('bar').style.width = ((current + 1) / order.length * 100) + '%';
  document.getElementById('sectionName').textContent = "القسم: " + sections[q.s];
  document.getElementById('qText').textContent = q.q;
  document.getElementById('testErr').textContent = "";

  const box = document.getElementById('options');
  box.innerHTML = "";
  item.opts.forEach(oi => {
    const b = document.createElement('button');
    b.className = 'option' + (answers[current] === oi ? ' selected' : '');
    b.textContent = q.o[oi];
    b.onclick = () => { answers[current] = oi; renderQ(); };
    box.appendChild(b);
  });

  document.getElementById('prevBtn').style.visibility = current === 0 ? 'hidden' : 'visible';
  document.getElementById('nextBtn').textContent = current === order.length - 1 ? 'إنهاء الاختبار' : 'التالي';
}

function nextQ(){
  if(answers[current] === null){
    document.getElementById('testErr').textContent = "يرجى اختيار إجابة";
    return;
  }
  if(current < order.length - 1){ current++; renderQ(); }
  else if(confirm("هل أنت متأكد من إنهاء الاختبار؟")){ finishTest(); }
}

function prevQ(){
  if(current > 0){ current--; renderQ(); }
}

function startTimer(){
  updateTimer();
  timerId = setInterval(() => {
    timeLeft--;
    updateTimer();
    if(timeLeft <= 0){ finishTest(); }
  }, 1000);
}

function updateTimer(){
  const m = String(Math.floor(timeLeft / 60)).padStart(2,'0');
  const s = String(timeLeft % 60).padStart(2,'0');
  const t = document.getElementById('timer');
  t.textContent = m + ':' + s;
  t.classList.toggle('warn', timeLeft <= 300);
}

function loadResults(){
  try { return JSON.parse(localStorage.getItem('teacherResults')) || []; }
  catch(e){ return []; }
}

function finishTest(){
  if(finished) return;
  finished = true;
  clearInterval(timerId);
  const keys = candidate.sections || Object.keys(sections);
  const scores = {};
  keys.forEach(k => scores[k] = { correct:0, total:0, unanswered:0 });
  const wrong = [];
  order.forEach((item, idx) => {
    const q = questions[item.i];
    const sc = scores[q.s];
    sc.total++;
    const ans = answers[idx];
    if(ans === q.a){ sc.correct++; }
    else {
      if(ans === null) sc.unanswered++;
      wrong.push({ s: q.s, q: q.q, your: ans === null ? null : q.o[ans], right: q.o[q.a] });
    }
  });
  let correct = 0;
  Object.values(scores).forEach(v => correct += v.correct);
  const percent = Math.round(correct / order.length * 100);
  const timeUsed = candidate.minutes * 60 - Math.max(timeLeft, 0);

  const results = loadResults();
  results.push({ ...candidate, scores, percent, correct, totalQ: order.length,
    unanswered: answers.filter(a => a === null).length, timeUsed, wrong });
  try { localStorage.setItem('teacherResults', JSON.stringify(results)); } catch(e){}
  show('endScreen');
}

function login(){
  const p = document.getElementById('pass').value;
  if(p === ADMIN_PASS){
    document.getElementById('pass').value = "";
    document.getElementById('loginErr').textContent = "";
    const res = loadResults();
    if(res.length){ openReport(res.length - 1); }
    else { renderAdmin(); show('adminScreen'); }
  } else {
    document.getElementById('loginErr').textContent = "كلمة السر غير صحيحة";
  }
}

function renderAdmin(){
  renderSettings();
  const list = document.getElementById('adminList');
  const results = loadResults();
  list.innerHTML = "";
  if(results.length === 0){
    list.textContent = "لا يوجد متقدمون بعد.";
    return;
  }
  const table = document.createElement('table');
  const head = document.createElement('tr');
  ["الاسم","التاريخ","النتيجة","التقرير"].forEach(h => {
    const th = document.createElement('th'); th.textContent = h; head.appendChild(th);
  });
  table.appendChild(head);
  for(let idx = results.length - 1; idx >= 0; idx--){
    const r = results[idx];
    const tr = document.createElement('tr');
    [r.name, r.date, r.percent + "%"].forEach(v => {
      const td = document.createElement('td'); td.textContent = v; tr.appendChild(td);
    });
    const td = document.createElement('td');
    const b = document.createElement('button');
    b.className = 'view-btn'; b.textContent = 'عرض';
    b.onclick = () => openReport(idx);
    td.appendChild(b); tr.appendChild(td);
    table.appendChild(tr);
  }
  list.appendChild(table);
}

let currentReport = null;

function analyze(r){
  const rows = Object.keys(sections).filter(k => r.scores && r.scores[k] && r.scores[k].total).map(k => {
    const v = r.scores[k];
    return { name: sections[k], correct: v.correct, total: v.total, p: Math.round(v.correct / v.total * 100) };
  });
  const weak = rows.filter(x => x.p < 70).map(x => x.name);
  const danger = rows.filter(x => x.p < 50).map(x => x.name);
  const strong = rows.filter(x => x.p >= 85).map(x => x.name);
  let rec, cls, level;
  if(r.percent >= 85){ level = "ممتاز"; rec = "أوصي بتعيينه"; cls = "good"; }
  else if(r.percent >= 70){ level = "جيد"; rec = "أوصي بتعيينه مع المتابعة"; cls = "mid"; }
  else if(r.percent >= 50){ level = "ضعيف"; rec = "لا أوصي بتعيينه إلا بعد تدريب"; cls = "bad"; }
  else { level = "غير مناسب"; rec = "لا أوصي بتعيينه"; cls = "bad"; }
  return { rows, weak, danger, strong, rec, cls, level };
}

function apologyText(r, a){
  let t = `الأستاذ/ة ${r.name} المحترم/ة،\nتحية طيبة وبعد،\n`;
  t += `نشكر لك تقدّمك لوظيفة معلم ${r.subject} في مدرستنا، واهتمامك بالانضمام إلى أسرتنا التعليمية.\n`;
  t += `وبعد دراسة نتيجة اختبار الكفاءة، نعتذر عن عدم إمكانية قبول طلبك في الوقت الحالي.\n`;
  if(a.weak.length) t += `وننصحك بتعزيز مهاراتك في: ${a.weak.join('، ')}.\n`;
  t += `مع خالص تمنياتنا لك بالتوفيق والنجاح.\nإدارة المدرسة`;
  return t;
}

function reportText(r, a){
  let t = `*تقرير اختبار كفاءة المعلمين*\n`;
  t += `الاسم: ${r.name}\nالهاتف: ${r.phone}\nالمادة: ${r.subject}\nالمؤهل: ${r.degree}\nالخبرة: ${r.experience}\nالنموذج: ${r.form || "-"}\nتاريخ الاختبار: ${r.date}\n\n`;
  t += `الأقسام المفحوصة: ${a.rows.map(x => x.name).join('، ')}\n`;
  if(r.totalQ) t += `الإجابات الصحيحة: ${r.correct} من ${r.totalQ}\n`;
  if(r.timeUsed !== undefined) t += `الوقت المستغرق: ${fmtTime(r.timeUsed)} من ${r.minutes} دقيقة\n`;
  t += `*النتيجة النهائية: ${r.percent}% (${a.level})*\n`;
  a.rows.forEach(x => t += `- ${x.name}: ${x.correct} من ${x.total} (${x.p}%)\n`);
  if(a.strong.length) t += `\nنقاط القوة: ${a.strong.join('، ')}`;
  if(a.weak.length) t += `\nنقاط الضعف: ${a.weak.join('، ')}`;
  if(a.danger.length) t += `\n⚠️ تنبيه: ضعف شديد في ${a.danger.join('، ')}`;
  t += `\n\n*التوصية: ${a.rec}*\n\ndahshansoft.com`;
  return t;
}

function addLine(box, label, value){
  const p = document.createElement('p');
  const b = document.createElement('b'); b.textContent = label + ": ";
  p.appendChild(b); p.appendChild(document.createTextNode(value));
  box.appendChild(p);
}

function openReport(idx){
  const r = loadResults()[idx];
  if(!r) return;
  const a = analyze(r);
  currentReport = { r, a };
  const body = document.getElementById('reportBody');
  body.innerHTML = "";

  const info = document.createElement('div'); info.className = 'info';
  addLine(info, "الاسم", r.name);
  addLine(info, "الهاتف", r.phone);
  addLine(info, "المادة", r.subject);
  addLine(info, "المؤهل", r.degree);
  addLine(info, "الخبرة", r.experience);
  addLine(info, "النموذج", r.form || "-");
  addLine(info, "تاريخ الاختبار", r.date);
  addLine(info, "الأقسام المفحوصة", a.rows.map(x => x.name).join('، '));
  if(r.totalQ) addLine(info, "الإجابات الصحيحة", r.correct + " من " + r.totalQ + " سؤالًا");
  if(r.totalQ) addLine(info, "أسئلة لم يُجب عنها", String(r.unanswered || 0));
  if(r.timeUsed !== undefined) addLine(info, "الوقت المستغرق", fmtTime(r.timeUsed) + " من " + r.minutes + " دقيقة");
  addLine(info, "النتيجة النهائية", r.percent + "% (" + a.level + ")");
  body.appendChild(info);

  const table = document.createElement('table');
  const head = document.createElement('tr');
  ["القسم","الصحيح","النسبة"].forEach(h => { const th = document.createElement('th'); th.textContent = h; head.appendChild(th); });
  table.appendChild(head);
  a.rows.forEach(x => {
    const tr = document.createElement('tr');
    [x.name, x.correct + " من " + x.total, x.p + "%"].forEach(v => { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); });
    if(x.p < 50) tr.style.color = '#c0392b';
    table.appendChild(tr);
  });
  body.appendChild(table);

  if(a.strong.length) addLine(body, "نقاط القوة", a.strong.join('، '));
  if(a.weak.length) addLine(body, "نقاط الضعف", a.weak.join('، '));
  if(a.danger.length){
    const w = document.createElement('div'); w.className = 'warn-box';
    w.textContent = "⚠️ تنبيه: ضعف شديد في " + a.danger.join('، ') + (r.percent >= 70 ? "، رغم أن المجموع مقبول." : ".");
    body.appendChild(w);
  }

  if(r.wrong && r.wrong.length){
    const d = document.createElement('details');
    const sm = document.createElement('summary');
    sm.textContent = `تفاصيل الأخطاء (${r.wrong.length} سؤالًا) — اضغط للعرض`;
    d.appendChild(sm);
    Object.keys(sections).forEach(k => {
      const items = r.wrong.filter(w => w.s === k);
      if(!items.length) return;
      const h = document.createElement('div'); h.className = 'wsec';
      h.textContent = sections[k] + " (" + items.length + ")";
      d.appendChild(h);
      items.forEach((w, n) => {
        const row = document.createElement('div'); row.className = 'wq';
        const qd = document.createElement('div'); qd.textContent = (n + 1) + ". " + w.q;
        const yd = document.createElement('div'); yd.className = 'yours';
        yd.textContent = "إجابته: " + (w.your === null ? "لم يُجب" : w.your);
        const rd = document.createElement('div'); rd.className = 'right';
        rd.textContent = "الصحيح: " + w.right;
        row.appendChild(qd); row.appendChild(yd); row.appendChild(rd);
        d.appendChild(row);
      });
    });
    body.appendChild(d);
  }

  const rec = document.createElement('div');
  rec.className = 'rec ' + a.cls;
  rec.textContent = "التوصية: " + a.rec;
  body.appendChild(rec);

  const apBtn = document.getElementById('apologyBtn');
  if(a.cls === 'bad'){
    const h = document.createElement('p'); h.style.fontWeight = 'bold'; h.style.marginTop = '12px';
    h.textContent = "رسالة الاعتذار للمتقدم:";
    body.appendChild(h);
    const ap = document.createElement('div'); ap.className = 'apology';
    ap.textContent = apologyText(r, a);
    body.appendChild(ap);
    apBtn.style.display = 'block';
  } else {
    apBtn.style.display = 'none';
  }
  show('reportScreen');
}

function shareReport(){
  if(!currentReport) return;
  window.open('https://wa.me/?text=' + encodeURIComponent(reportText(currentReport.r, currentReport.a)), '_blank');
}

function sendApology(){
  if(!currentReport) return;
  const phone = '962' + currentReport.r.phone.slice(1);
  window.open('https://wa.me/' + phone + '?text=' + encodeURIComponent(apologyText(currentReport.r, currentReport.a)), '_blank');
}

function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  return String(Math.floor(sec / 60)).padStart(2,'0') + ':' + String(sec % 60).padStart(2,'0');
}

function printReport(){
  document.querySelectorAll('#reportBody details').forEach(d => d.open = true);
  window.print();
}

updateTestInfo();
</script>
</body>
</html>
